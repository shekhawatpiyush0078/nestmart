<!DOCTYPE html>
<head>
    <title>E-Commerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <style>
        *{padding: 0; margin: 0;}
        body{background-color: bisque;}
        .main-box{text-align: center; margin-top: 200px;}
        .main1 h1{ margin: auto;width: 19%;text-align: start; font-size: 30px;}
        .main1 h3{font-size: small; text-align: start; margin-top: 12px; margin: auto; width: 19%;}
        .main2{width: 19%; margin: auto; margin-top: 15px; text-align: start; background-color: white;padding: 16px; border-radius: 10px;}
        .main3{width: 19%; margin: auto; margin-top: 15px; text-align: start;background-color: white;padding: 16px; border-radius: 10px;}
        .main4 h5{width: 19%;margin: auto; text-align: end; margin-top: 9px; font-size: 15px;color: red;}
        .main4 h6{width: 19%;margin: auto; text-align: end; margin-top: 9px; font-size: 15px;color: red;}
        .main4 button{width: 19%; margin: auto; padding: 13px;border-radius: 15px; margin-top: 12px; background-color: rgb(11, 154, 202);}
        .main4 h3{width: 19%; margin: auto;text-align: center; margin-top: 12px; color: red;}
        .main4 i{width: 5%; margin: auto; margin-top: 18px; background-color: red; padding: 10px; border-radius: 15px; color: white; }
    </style>
    <div class="main-box">
        <div class="main1">
            <h1>Login</h1>
            <h3>Don't have an account? <a href="project2{registrationpage}.html">Create Account</a></h3>
           
        </div>
        <div class="main2">
            <i class="fas fa-user"></i>
            <input type="text" placeholder="Enter Username"/>
            <i class="fas fa-check-circle"></i>

        </div>
        <div class="main3">
            <i class="fas fa-lock"></i>
            <input type="password" placeholder="enter your password"/>
            <i class="fas fa-eye-slash"></i>

        </div>
        <div class="main4">
            <h5>Forgot Your Password</h5>
            <h6>Sign up</h6>
            
            <a href="project2homepage.html"><button>Login</button></a>
            <h3>Login With</h3>
            <i class="fab fa-facebook"></i>
            <i class="fab fa-google"></i>
            <i class="fab fa-twitter"></i>

        </div>

    </div>


</body>
